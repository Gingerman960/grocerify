@let s = size();
@let sw = strokeWidth();

<svg [attr.width]="s" [attr.height]="s" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
  @switch (name()) {
    @case ('check') {
      <polyline
        points="3.5,8.5 6.8,11.8 12.5,5"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw + 0.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }
    @case ('plus') {
      <line x1="8" y1="3.5" x2="8" y2="12.5" stroke="currentColor" [attr.stroke-width]="sw" stroke-linecap="round" />
      <line x1="3.5" y1="8" x2="12.5" y2="8" stroke="currentColor" [attr.stroke-width]="sw" stroke-linecap="round" />
    }
    @case ('edit') {
      <path
        d="M3 13 L3 10.5 L10 3.5 L12.5 6 L5.5 13 L3 13 Z"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linejoin="round"
      />
      <line x1="8.5" y1="5" x2="11" y2="7.5" stroke="currentColor" [attr.stroke-width]="sw" />
    }
    @case ('trash') {
      <path
        d="M3.5 5 L12.5 5 M5.5 5 L5.5 3.5 L10.5 3.5 L10.5 5 M5 5 L5.5 13 L10.5 13 L11 5"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }
    @case ('drag') {
      <g fill="currentColor">
        <circle cx="6" cy="4" r="1" />
        <circle cx="10" cy="4" r="1" />
        <circle cx="6" cy="8" r="1" />
        <circle cx="10" cy="8" r="1" />
        <circle cx="6" cy="12" r="1" />
        <circle cx="10" cy="12" r="1" />
      </g>
    }
    @case ('x') {
      <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" [attr.stroke-width]="sw" stroke-linecap="round" />
      <line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" [attr.stroke-width]="sw" stroke-linecap="round" />
    }
    @case ('kebab') {
      <g fill="currentColor">
        <circle cx="8" cy="3.5" r="1.3" />
        <circle cx="8" cy="8" r="1.3" />
        <circle cx="8" cy="12.5" r="1.3" />
      </g>
    }
    @case ('alert') {
      <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" [attr.stroke-width]="sw" />
      <line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" [attr.stroke-width]="sw" stroke-linecap="round" />
      <circle cx="8" cy="11" r="0.7" fill="currentColor" />
    }
    @case ('refresh') {
      <path
        d="M3 8 A5 5 0 0 1 12.5 6"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linecap="round"
      />
      <polyline
        points="12.5,3 12.5,6 9.5,6"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M13 8 A5 5 0 0 1 3.5 10"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linecap="round"
      />
      <polyline
        points="3.5,13 3.5,10 6.5,10"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }
    @case ('basket') {
      <path
        d="M4 7 L5.5 13 L12.5 13 L14 7 Z"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linejoin="round"
      />
      <path
        d="M6 7 L8 3 L10 3 L12 7"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="sw"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <line x1="9" y1="9" x2="9" y2="11.5" stroke="currentColor" [attr.stroke-width]="sw" stroke-linecap="round" />
    }
  }
</svg>
